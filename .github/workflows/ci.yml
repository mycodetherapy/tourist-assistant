name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Учётные данные ниже — только для ephemeral CI (контейнеры postgres/redis на runner GitHub).
# Они не связаны с VPS/продом, живут минуты и недоступны из интернета.
env:
  DATABASE_URL: postgresql+psycopg://tourist:tourist@localhost:5432/tourist
  TEST_DATABASE_URL: postgresql+psycopg://tourist:tourist@localhost:5432/tourist_test
  REDIS_URL: redis://localhost:6379/0
  JWT_SECRET: ci-jwt-secret-not-for-production-use
  SETTINGS_ENCRYPTION_KEY: ci-settings-key-not-for-production-use

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    services:
      # Throwaway Postgres на runner — не prod; пароль «tourist» здесь осознанно публичный.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tourist
          POSTGRES_PASSWORD: tourist
          POSTGRES_DB: tourist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tourist -d tourist"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Prepare test database
        run: python scripts/ensure_test_database.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  api-node-tests:
    name: api-node tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: api-node/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and unit tests
        run: npm run build && npm test

  web-build:
    name: web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  docker-build:
    name: Docker build smoke
    runs-on: ubuntu-latest
    needs: [python-tests, api-node-tests, web-build]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: tourist-assistant-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build api-node image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api-node
          push: false
          tags: tourist-assistant-api-node:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: false
          tags: tourist-assistant-web:ci
          build-args: |
            NGINX_CONF=nginx.pg.conf
            VITE_MAP_PROVIDER=maplibre
          cache-from: type=gha
          cache-to: type=gha,mode=max
