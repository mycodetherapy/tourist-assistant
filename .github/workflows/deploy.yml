name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/mycodetherapy/tourist-assistant

jobs:
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: worker
            context: .
            file: Dockerfile
          - name: api-node
            context: .
            file: Dockerfile.api-node
          - name: web
            context: ./web
            file: ./web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (${{ matrix.name }})
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (${{ matrix.name }})
        if: matrix.name != 'web'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Build and push (web)
        if: matrix.name == 'web'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NGINX_CONF=nginx.pg.conf
            VITE_YANDEX_MAPS_API_KEY=${{ secrets.VITE_YANDEX_MAPS_API_KEY }}
            VITE_YANDEX_METRIKA_ID=${{ secrets.VITE_YANDEX_METRIKA_ID }}
            VITE_YANDEX_SMARTCAPTCHA_CLIENT_KEY=${{ secrets.VITE_YANDEX_SMARTCAPTCHA_CLIENT_KEY }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Copy deploy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/docker-compose.prod.yml,scripts/deploy_prod.sh,scripts/verify_prod_env.sh,scripts/prod_ps.sh,scripts/prod_compose_env.sh,scripts/rotate_postgres_password.sh,scripts/stats.sh"
          target: /opt/tourist-assistant
          strip_components: 0

      - name: Normalize deploy paths on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            mkdir -p /opt/tourist-assistant/data /opt/tourist-assistant/scripts
            mv -f /opt/tourist-assistant/deploy/docker-compose.prod.yml /opt/tourist-assistant/docker-compose.prod.yml
            mv -f /opt/tourist-assistant/scripts/deploy_prod.sh /opt/tourist-assistant/deploy_prod.sh
            mv -f /opt/tourist-assistant/scripts/verify_prod_env.sh /opt/tourist-assistant/verify_prod_env.sh
            mv -f /opt/tourist-assistant/scripts/prod_ps.sh /opt/tourist-assistant/prod_ps.sh
            mv -f /opt/tourist-assistant/scripts/prod_compose_env.sh /opt/tourist-assistant/prod_compose_env.sh
            mv -f /opt/tourist-assistant/scripts/rotate_postgres_password.sh /opt/tourist-assistant/rotate_postgres_password.sh
            mv -f /opt/tourist-assistant/scripts/stats.sh /opt/tourist-assistant/stats.sh
            chmod +x /opt/tourist-assistant/deploy_prod.sh /opt/tourist-assistant/verify_prod_env.sh /opt/tourist-assistant/prod_ps.sh /opt/tourist-assistant/rotate_postgres_password.sh /opt/tourist-assistant/stats.sh
            rmdir /opt/tourist-assistant/deploy 2>/dev/null || true

      - name: Pull images and restart stack
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd /opt/tourist-assistant
            export IMAGE_TAG GHCR_USER GHCR_TOKEN
            ./deploy_prod.sh
