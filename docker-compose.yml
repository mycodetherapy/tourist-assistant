# Туристический ассистент: Node API + React + Postgres + Redis + Python worker.
#
# Полный стек:
#   cp .env.example .env
#   docker compose up -d --build
#
# City pack + OSRM:
#   bash scripts/city_pack_batch.sh
#   docker compose --profile routing up -d osrm-gateway osrm-kazan osrm-yoshkar-ola
#
# Только инфра на хосте (порты 5433 / 6380):
#   docker compose --profile infra up -d postgres redis
#   export DATABASE_URL=postgresql+psycopg://tourist:tourist@localhost:5433/tourist
#   alembic upgrade head

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tourist
      POSTGRES_PASSWORD: tourist
      POSTGRES_DB: tourist
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/02-create-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tourist -d tourist"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NGINX_CONF: nginx.pg.conf
    ports:
      - "5173:80"
    depends_on:
      - api-node

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: tourist-assistant:latest
    command: sh -c "alembic upgrade head && python -m worker"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://tourist:tourist@postgres:5432/tourist
      TEST_DATABASE_URL: postgresql+psycopg://tourist:tourist@postgres:5432/tourist_test
      REDIS_URL: redis://redis:6379/0
      TOURIST_ASSISTANT_IN_DOCKER: "1"
      # Внутри compose — имя сервиса, не 127.0.0.1 из .env хоста
      OSRM_GATEWAY_URL: http://osrm-gateway:8080
      OSRM_URL: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    restart: unless-stopped

  api-node:
    build:
      context: .
      dockerfile: Dockerfile.api-node
    ports:
      - "${API_NODE_PORT:-8001}:8001"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://tourist:tourist@postgres:5432/tourist
      REDIS_URL: redis://redis:6379/0
      API_NODE_PORT: "8001"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8001/api/auth/google/callback}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # OSRM gateway: прокси + lazy start osrm-{city}
  osrm-gateway:
    profiles: [routing]
    image: tourist-assistant:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m services.osrm_gateway
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./docker-compose.yml:/app/docker-compose.yml:ro
    ports:
      - "${OSRM_GATEWAY_PORT:-8080}:8080"
    environment:
      TOURIST_ASSISTANT_IN_DOCKER: "1"
      OSRM_GATEWAY_DOCKER: "1"
      COMPOSE_FILE: /app/docker-compose.yml
    restart: unless-stopped

  osrm-kazan:
    profiles: [routing, routing-city-kazan]
    image: ghcr.io/project-osrm/osrm-backend:latest
    command: osrm-routed --algorithm mld /data/kazan.osrm
    volumes:
      - ./data/cities/kazan/osrm:/data
    ports:
      - "${OSRM_KAZAN_HOST_PORT:-5002}:5000"
    restart: unless-stopped

  osrm-yoshkar-ola:
    profiles: [routing, routing-city-yoshkar-ola]
    image: ghcr.io/project-osrm/osrm-backend:latest
    command: osrm-routed --algorithm mld /data/yoshkar-ola.osrm
    volumes:
      - ./data/cities/yoshkar-ola/osrm:/data
    ports:
      - "${OSRM_YOSHKAR_OLA_HOST_PORT:-5003}:5000"
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
