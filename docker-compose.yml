# Прогуляй: Node API + React + Postgres + Redis + Python worker.
#
# Полный стек (UI в Docker на :5173):
#   docker compose --profile docker-web up -d --build
#
# Бэкенд в Docker + фронт локально (npm run dev в web/):
#   docker compose up -d --build
#   cd web && npm run dev
#
# City pack (POI):
#   bash scripts/city_pack_batch.sh
#
# Только инфра на хосте (порты 5433 / 6380):
#   docker compose --profile infra up -d postgres redis
#   export DATABASE_URL=postgresql+psycopg://tourist:tourist@localhost:5433/tourist
#   alembic upgrade head
#
# OSRM ephemeral (VPS 4 ГБ): OSRM_MODE=ephemeral + docker.sock у worker
#   (графы на диске; osrm-routed только на время geometry). Always-on: profile osrm.

name: tourist-assistant

networks:
  default:
    name: tourist-assistant

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tourist
      POSTGRES_PASSWORD: tourist
      POSTGRES_DB: tourist
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/02-create-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tourist -d tourist"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    profiles:
      - docker-web
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NGINX_CONF: nginx.pg.conf
        VITE_YANDEX_MAPS_API_KEY: ${VITE_YANDEX_MAPS_API_KEY:-}
        VITE_YANDEX_METRIKA_ID: ${VITE_YANDEX_METRIKA_ID:-}
        VITE_YANDEX_SMARTCAPTCHA_CLIENT_KEY: ${VITE_YANDEX_SMARTCAPTCHA_CLIENT_KEY:-}
        VITE_MAP_PROVIDER: ${VITE_MAP_PROVIDER:-maplibre}
    ports:
      - "5173:80"
    depends_on:
      - api-node

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: tourist-assistant:latest
    command: sh -c "alembic upgrade head && python -m worker"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://tourist:tourist@postgres:5432/tourist
      TEST_DATABASE_URL: postgresql+psycopg://tourist:tourist@postgres:5432/tourist_test
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required in .env}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?SETTINGS_ENCRYPTION_KEY required in .env}
      TOURIST_ASSISTANT_IN_DOCKER: "1"
      TOURIST_DATA_DIR: /app/data
      # Абсолютный путь ХОСТА к ./data (для docker run -v из worker через sock)
      TOURIST_HOST_DATA_DIR: ${TOURIST_HOST_DATA_DIR:-${PWD}/data}
      # Always-on OSRM (profile osrm) ИЛИ ephemeral (VPS 4 ГБ).
      OSRM_MODE: ${OSRM_MODE:-http}
      OSRM_BASE_URL: ${OSRM_DOCKER_BASE_URL:-http://osrm:5000}
      OSRM_DATASET: ${OSRM_DATASET:-kazan}
      OSRM_URL_BY_SLUG: ${OSRM_URL_BY_SLUG:-}
      # ephemeral: путь ХОСТА к data/cities (bind для docker run), сеть compose
      OSRM_HOST_DATA_CITIES: ${OSRM_HOST_DATA_CITIES:-${PWD}/data/cities}
      OSRM_DOCKER_NETWORK: ${OSRM_DOCKER_NETWORK:-tourist-assistant}
      OSRM_EPHEMERAL_URL: ${OSRM_EPHEMERAL_URL:-http://osrm-ephemeral:5000}
      OSRM_IMAGE: ${OSRM_IMAGE:-ghcr.io/project-osrm/osrm-backend:v5.27.1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  api-node:
    build:
      context: .
      dockerfile: Dockerfile.api-node
    ports:
      - "${API_NODE_PORT:-8001}:8001"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://tourist:tourist@postgres:5432/tourist
      REDIS_URL: redis://redis:6379/0
      API_NODE_PORT: "8001"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required in .env}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?SETTINGS_ENCRYPTION_KEY required in .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8001/api/auth/google/callback}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TOURIST_DATA_DIR: /app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped

  # Пеший роутер OSRM (опционально). Подготовка графа:
  #   bash scripts/osrm_prepare.sh kazan
  #   OSRM_DATASET=kazan docker compose --profile osrm up -d osrm
  # Worker: OSRM_DOCKER_BASE_URL=http://osrm:5000 + OSRM_URL_BY_SLUG для доп. городов
  osrm:
    profiles:
      - osrm
    image: ${OSRM_IMAGE:-ghcr.io/project-osrm/osrm-backend:v5.27.1}
    command:
      - osrm-routed
      - --algorithm
      - mld
      - /data/${OSRM_DATASET:-kazan}/osrm/${OSRM_DATASET:-kazan}.osrm
    ports:
      - "${OSRM_HOST_PORT:-5001}:5000"
    volumes:
      - ./data/cities:/data:ro
    restart: unless-stopped

  osrm-yoshkar-ola:
    profiles:
      - osrm
    image: ${OSRM_IMAGE:-ghcr.io/project-osrm/osrm-backend:v5.27.1}
    command:
      - osrm-routed
      - --algorithm
      - mld
      - /data/yoshkar-ola/osrm/yoshkar-ola.osrm
    ports:
      - "${OSRM_YOSHKAR_OLA_HOST_PORT:-5002}:5000"
    volumes:
      - ./data/cities:/data:ro
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
