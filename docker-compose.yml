# Туристический ассистент: Node API + React + Postgres + Redis.
#
# SQLite + FastAPI (legacy):
#   docker compose --profile legacy up api web
#
# Полный SaaS-стек (Postgres + Redis + worker + Node API):
#   cp .env.example .env
#   # в .env раскомментируйте для Docker-сети:
#   # DATABASE_URL=postgresql+psycopg://tourist:tourist@postgres:5432/tourist
#   # REDIS_URL=redis://redis:6379/0
#   docker compose --profile pg up -d --build
#
# Только инфра на хосте (порты 5433 / 6380):
#   docker compose --profile infra up -d postgres redis
#   export DATABASE_URL=postgresql+psycopg://tourist:tourist@localhost:5433/tourist
#   alembic upgrade head

services:
  postgres:
    profiles: ["pg", "infra"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tourist
      POSTGRES_PASSWORD: tourist
      POSTGRES_DB: tourist
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tourist -d tourist"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    profiles: ["pg", "infra"]
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: Dockerfile
    image: tourist-assistant:latest
    entrypoint: ["/app/scripts/docker_api_entrypoint.sh"]
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/trips.db
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL:-}
      TOURIST_ASSISTANT_IN_DOCKER: "1"
      LANGFUSE_HOST: ${LANGFUSE_HOST_DOCKER:-http://host.docker.internal:3000}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false

  web:
    profiles: ["legacy"]
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NGINX_CONF: nginx.conf
    ports:
      - "5173:80"
    depends_on:
      - api

  web-pg:
    profiles: ["pg"]
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NGINX_CONF: nginx.pg.conf
    ports:
      - "5173:80"
    depends_on:
      - api-node

  worker:
    profiles: ["pg"]
    build:
      context: .
      dockerfile: Dockerfile
    image: tourist-assistant:latest
    command: sh -c "alembic upgrade head && python -m worker"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://tourist:tourist@postgres:5432/tourist
      REDIS_URL: redis://redis:6379/0
      TOURIST_ASSISTANT_IN_DOCKER: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  api-node:
    profiles: ["pg"]
    build:
      context: ./api-node
      dockerfile: Dockerfile
    ports:
      - "${API_NODE_PORT:-8001}:8001"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://tourist:tourist@postgres:5432/tourist
      REDIS_URL: redis://redis:6379/0
      API_NODE_PORT: "8001"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8001/api/auth/google/callback}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
