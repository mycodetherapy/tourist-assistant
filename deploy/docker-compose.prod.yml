# Production stack: готовые образы из GHCR (без git pull / build на сервере).
#
# Первичная настройка на VPS:
#   sudo mkdir -p /opt/tourist-assistant/data
#   sudo cp deploy/env.example /opt/tourist-assistant/.env   # заполнить секреты
#   sudo docker login ghcr.io -u <github-user> -p <PAT read:packages>
#
# Деплой выполняет GitHub Actions (merge в main) через scripts/deploy_prod.sh

name: progulyai

networks:
  default:
    name: progulyai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tourist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}
      POSTGRES_DB: tourist
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tourist -d tourist"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/mycodetherapy/tourist-assistant}-worker:${IMAGE_TAG:?IMAGE_TAG required}
    command: sh -c "alembic upgrade head && python -m worker"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://tourist:${POSTGRES_PASSWORD}@postgres:5432/tourist
      REDIS_URL: redis://redis:6379/0
      TOURIST_ASSISTANT_IN_DOCKER: "1"
      OSRM_MODE: ${OSRM_MODE:-ephemeral}
      OSRM_BASE_URL: ${OSRM_DOCKER_BASE_URL:-http://osrm:5000}
      OSRM_DATASET: ${OSRM_DATASET:-kazan}
      OSRM_URL_BY_SLUG: ${OSRM_URL_BY_SLUG:-}
      OSRM_HOST_DATA_CITIES: ${OSRM_HOST_DATA_CITIES:-}
      OSRM_DOCKER_NETWORK: ${OSRM_DOCKER_NETWORK:-progulyai}
      OSRM_EPHEMERAL_URL: ${OSRM_EPHEMERAL_URL:-http://osrm-ephemeral:5000}
      OSRM_IMAGE: ${OSRM_IMAGE:-ghcr.io/project-osrm/osrm-backend:v5.27.1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  api-node:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/mycodetherapy/tourist-assistant}-api-node:${IMAGE_TAG:?IMAGE_TAG required}
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://tourist:${POSTGRES_PASSWORD}@postgres:5432/tourist
      REDIS_URL: redis://redis:6379/0
      API_NODE_PORT: "8001"
      TOURIST_DATA_DIR: /app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped

  web:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/mycodetherapy/tourist-assistant}-web:${IMAGE_TAG:?IMAGE_TAG required}
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api-node
    restart: unless-stopped

  # Опционально: пеший OSRM. Граф на VPS: data/cities/<slug>/osrm/
  #   OSRM_DATASET=kazan docker compose -f deploy/docker-compose.prod.yml --profile osrm up -d osrm
  osrm:
    profiles:
      - osrm
    image: ${OSRM_IMAGE:-ghcr.io/project-osrm/osrm-backend:v5.27.1}
    command:
      - osrm-routed
      - --algorithm
      - mld
      - /data/${OSRM_DATASET:-kazan}/osrm/${OSRM_DATASET:-kazan}.osrm
    volumes:
      - ./data/cities:/data:ro
    restart: unless-stopped

volumes:
  pg_data:
    name: ${POSTGRES_VOLUME_NAME:-progulyai_pg_data}
  redis_data:
    name: ${REDIS_VOLUME_NAME:-progulyai_redis_data}
