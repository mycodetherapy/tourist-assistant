# Каталог городских пакетов: FO PBF → extract.osm.pbf → poi.sqlite [→ osrm].
# tier: hot — файлы osrm на диске, ephemeral route на VPS
#       warm — extract+poi prebuild; osrm по нужде
# Политика: docs/city-catalog-policy.md
#
# Prebuild extract+poi: bash scripts/city_pack_batch.sh
# Prebuild OSRM (hot):  bash scripts/osrm_prepare_batch.sh
# Warm OSRM optional:   bash scripts/osrm_prepare_batch.sh --tier=warm

