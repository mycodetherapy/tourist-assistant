server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # www → apex (Caddy обычно передаёт исходный Host)
    if ($host ~* ^www\.progulyai\.ru$) {
        return 301 https://progulyai.ru$request_uri;
    }

    location = /robots.txt {
        charset utf-8;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        charset utf-8;
        default_type application/xml;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api-node:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /health {
        proxy_pass http://api-node:8001/health;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Swagger UI (@fastify/swagger-ui на api-node); без этого /docs отдаёт SPA → лендинг
    location /docs {
        proxy_pass http://api-node:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
