# Smoke-набор для offline eval (fixtures в eval/fixtures/)
cases:
  - id: spb_culture_smoke
    city: Санкт-Петербург
    dates: 1-4 августа 2026
    origin_city: Москва
    user_query: три маршрута по городу
    expect:
      tools:
        - search_route_materials
      sections:
        - routes
        - lifehacks
      min_route_urls: 3

  - id: msk_weekend_smoke
    city: Москва
    dates: 10-11 октября 2026
    origin_city: Санкт-Петербург
    user_query: выходные, пешие маршруты
    expect:
      tools: [search_route_materials]
      sections: [routes, lifehacks]
      min_route_urls: 3

  - id: kazan_family_smoke
